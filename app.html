<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>AGEx — Grand Plaza (App)</title>
  <meta name="description" content="AGEx Grand Plaza — app-body for the ecosystem. Sign in → choose a domain → choose a district." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    :root{
      --green:#0B3D2E;
      --green2:#083326;
      --gold:#F4B41A;

      --bg:#0B3D2E;          /* ONE SHADE BACKGROUND */
      --card:#FFFFFF;
      --ink:#0F0F0F;
      --muted:#5F6B66;
      --line:rgba(15,15,15,.10);
      --shadow:0 18px 45px rgba(0,0,0,.10);
      --radius:18px;
      --max:1100px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--ink);
      background: var(--bg);
    }
    a{color:inherit;text-decoration:none}

    /* TOP BAR (MINIMAL) */
    .topbar{
      position:sticky;top:0;z-index:60;
      background:rgba(11,61,46,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid rgba(255,255,255,.14);
    }
    .topbar .inner{
      max-width:var(--max);
      margin:0 auto;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:120px}
    .mark{
      width:38px;height:38px;border-radius:12px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--green),var(--green2));
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
    }
    .brand b{letter-spacing:.2px;color:#fff}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:9px 12px;border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      font-weight:900;
      background:rgba(255,255,255,.06);
      color:#fff;
      cursor:pointer;
      white-space:nowrap;
      transition:.12s ease;
      font-size:13px;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.gold{
      background:rgba(244,180,26,.18);
      border-color:rgba(244,180,26,.38);
      color:#fff;
    }

    /* APP WRAP */
    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:calc(100vh - 60px);
    }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* TOP PANEL (DOMAINS / SUB-DISTRICTS) */
    .navPanel{
      max-height:36vh; /* <= roughly one third */
      overflow:auto;
    }
    .navTop{
      padding:12px 12px 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    .navTitle{
      display:flex;flex-direction:column;gap:3px;min-width:0;
    }
    .navTitle b{color:var(--green);font-size:14px}
    .navTitle span{color:rgba(15,15,15,.60);font-weight:750;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .navControls{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .btnLite{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:9px 12px;border-radius:999px;
      border:1px solid var(--line);
      font-weight:900;
      background:#fff;
      color:rgba(15,15,15,.80);
      cursor:pointer;
      white-space:nowrap;
      font-size:13px;
    }

    .grid{
      padding:12px;
      display:grid;
      gap:10px;
      grid-template-columns:repeat(3, minmax(0, 1fr));
    }
    @media (max-width: 740px){ .grid{grid-template-columns:repeat(2, minmax(0, 1fr))} }
    @media (max-width: 420px){ .grid{grid-template-columns:1fr} }

    .tile{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:10px 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-height:54px;
      transition:.12s ease;
      text-align:left;
    }
    .tile:hover{transform:translateY(-1px)}
    .tile .left{display:flex;flex-direction:column;gap:2px;min-width:0}
    .tile .name{
      font-weight:950;color:#111;font-size:13px;line-height:1.15;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .tile .tag{
      font-weight:850;color:rgba(15,15,15,.55);font-size:11px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .tile .chev{font-weight:950;color:rgba(11,61,46,.85);opacity:.8;flex:0 0 auto}

    /* DISPLAY PANEL */
    .framePanel{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:46vh;
    }
    .frameTop{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background:#fff;
    }
    .frameTitle{
      display:flex;flex-direction:column;gap:2px;min-width:0;
    }
    .frameTitle b{color:var(--green);font-size:14px}
    .frameTitle span{
      font-size:12px;color:rgba(15,15,15,.60);font-weight:750;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw;
    }
    iframe{width:100%;flex:1;border:0;background:#fff}

    /* FOOT PANEL */
    .footPanel{
      padding:12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      background:#fff;
    }
    .footLinks{display:flex;gap:10px;flex-wrap:wrap}
    .footLinks a{
      font-size:12px;
      font-weight:850;
      color:rgba(15,15,15,.70);
      border:1px solid var(--line);
      padding:7px 10px;
      border-radius:999px;
      background:#fff;
    }
    .footNote{
      font-size:12px;
      font-weight:750;
      color:rgba(15,15,15,.55);
    }
  </style>
</head>

<body>
  <!-- TOP BAR -->
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 2.6l8 3.2v6.2c0 5.1-3.5 9.2-8 9.9-4.5-.7-8-4.8-8-9.9V5.8L12 2.6z" stroke="rgba(255,255,255,.92)" stroke-width="1.6"/>
            <path d="M8.3 12h6.9l-2.2-2.2 1.3-1.3 4.4 4.4-4.4 4.4-1.3-1.3 2.2-2.2H8.3V12z" fill="#F4B41A"/>
          </svg>
        </div>
        <div>
          <b>AGEx</b>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="shareBtn" type="button">Share</button>
        <button class="btn gold" id="installBtn" type="button" style="display:none">Install</button>
        <button class="btn" id="signOutBtn" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <div class="wrap">

    <!-- NAV TOP: DOMAINS / SUB-DISTRICTS -->
    <section class="panel navPanel" aria-label="Domains navigation">
      <div class="navTop">
        <div class="navTitle">
          <b id="navHeader">Domains</b>
          <span id="navSub">Choose a domain to open its districts.</span>
        </div>

        <div class="navControls">
          <button class="btnLite" id="backBtn" type="button" style="display:none">← Back</button>
          <button class="btnLite" id="openNewTabBtnTop" type="button">Open current</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
    </section>

    <!-- DISPLAY DOWN -->
    <section class="panel framePanel" aria-label="Display area">
      <div class="frameTop">
        <div class="frameTitle">
          <b id="frameTitle">Welcome</b>
          <span id="frameSub">Choose a domain above.</span>
        </div>
        <div class="navControls">
          <button class="btnLite" id="refreshBtn" type="button">Refresh</button>
          <button class="btnLite" id="openNewTabBtn" type="button">Open current</button>
        </div>
      </div>
      <iframe id="frame" title="AGEx Content"></iframe>
    </section>

    <!-- FOOT -->
    <section class="panel footPanel" aria-label="Support links">
      <div class="footLinks">
        <a href="mailto:arinonebusiness@gmail.com">Support</a>
        <a href="#" onclick="alert('Privacy page coming soon.');return false;">Privacy</a>
        <a href="#" onclick="alert('Terms page coming soon.');return false;">Terms</a>
      </div>
      <div class="footNote">AGEx • App Shell • GitHub Pages</div>
    </section>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    // =========================
    // AUTH GUARD (current behavior)
    // =========================
    (async function authGuard(){
      try{
        const { data } = await supabaseClient.auth.getSession();
        const session = data?.session;
        if(!session){
          location.href = "auth.html";
          return;
        }
      }catch(e){
        // If supabase is not loading correctly, still fail-safe to auth
        location.href = "auth.html";
      }
    })();

    // =========================
    // DATA: DOMAINS + SUB-DISTRICTS
    // (Edit names and links here only)
    // =========================
    const DOMAINS = [
      {
        id:"finance",
        name:"Finance",
        tag:"Smart Money • Lab • Business",
        items:[
          { name:"Smart Money Hub", tag:"Academy", url:"https://charlesarin101.github.io/agexsmartmoneyhub/" },
          { name:"Income Stack Lab", tag:"Execution", url:"https://charlesarin101.github.io/Income_streams_lab/" },
          { name:"BigSharks", tag:"Business", url:"https://charlesarin1-creator.github.io/bigsharks-site/" },
        ]
      },
      {
        id:"home",
        name:"Home",
        tag:"Family • Order • Living",
        items:[
          { name:"The Steward’s Charter", tag:"Finance Charter", url:"https://charlesarin101.github.io/the-stewards-charter/" },
          { name:"HomeJoy Executives", tag:"Coming soon", url:"#coming-soon" },
          { name:"Steward Lodge Gate", tag:"Members", url:"https://charlesarin101.github.io/agexsmartmoneyhub/lodge.html?v=2" },
        ]
      },
      {
        id:"marketplace",
        name:"Marketplace",
        tag:"Provision • Store",
        items:[
          { name:"Arin’s Global Marketplace", tag:"Selfany Store", url:"https://selfany.com/s/arinsglobalmarketplace" },
          { name:"The Stigweard’s Provision", tag:"Provision", url:"https://charlesarin1-creator.github.io/the-stigweards-provisions/" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      },
      {
        id:"education",
        name:"Education",
        tag:"Academy • Learning",
        items:[
          { name:"Christian Child Academy", tag:"School", url:"https://charlesarin101.github.io/christianchildacademy_zaria/" },
          { name:"Smart Money Hub", tag:"Academy", url:"https://charlesarin101.github.io/agexsmartmoneyhub/" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      },
      {
        id:"media",
        name:"Media",
        tag:"iService • Downloads",
        items:[
          { name:"iService", tag:"Coming soon", url:"#coming-soon" },
          { name:"Crystal Literature", tag:"Coming soon", url:"#coming-soon" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      },
      {
        id:"exchangeLife",
        name:"Exchange Life",
        tag:"Encounters • Transform",
        items:[
          { name:"Encounters", tag:"Coming soon", url:"#coming-soon" },
          { name:"Frequency", tag:"Coming soon", url:"#coming-soon" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      },
      {
        id:"foundation",
        name:"Foundation",
        tag:"Giving • Legacy",
        items:[
          { name:"Foundation Hub", tag:"Coming soon", url:"#coming-soon" },
          { name:"Partners", tag:"Coming soon", url:"#coming-soon" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      },
      {
        id:"logistics",
        name:"Logistics",
        tag:"Operations • Movement",
        items:[
          { name:"Logistics Desk", tag:"Coming soon", url:"#coming-soon" },
          { name:"Trusted Operator", tag:"Coming soon", url:"#coming-soon" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      },
      {
        id:"plaza",
        name:"Grand Plaza",
        tag:"Home / Map",
        items:[
          { name:"Grand Plaza (Original)", tag:"Home", url:"./" },
          { name:"This App (app.html)", tag:"Shell", url:"./app.html" },
          { name:"Coming Soon", tag:"", url:"#coming-soon" },
        ]
      }
    ];

    // =========================
    // UI STATE
    // =========================
    const grid = document.getElementById("grid");
    const navHeader = document.getElementById("navHeader");
    const navSub = document.getElementById("navSub");
    const backBtn = document.getElementById("backBtn");

    const frame = document.getElementById("frame");
    const frameTitle = document.getElementById("frameTitle");
    const frameSub = document.getElementById("frameSub");

    const STATE_KEY = "AGEX_APP_STATE_V2";
    // state = { mode: "domains" | "items", domainId: string|null, lastUrl: string|null, lastLabel: string|null }

    function loadState(){
      try{
        return JSON.parse(localStorage.getItem(STATE_KEY) || "{}");
      }catch(e){ return {}; }
    }
    function saveState(s){
      localStorage.setItem(STATE_KEY, JSON.stringify(s));
    }

    function setFrame(url, label){
      if(url === "#coming-soon"){
        alert("Coming soon. This district will be filled as we build.");
        return;
      }
      frame.src = url;
      frameTitle.textContent = label || "AGEx";
      frameSub.textContent = url;
      const st = loadState();
      st.lastUrl = url;
      st.lastLabel = label || "AGEx";
      saveState(st);
    }

    function renderDomains(){
      navHeader.textContent = "Domains";
      navSub.textContent = "Choose a domain to open its districts.";
      backBtn.style.display = "none";

      grid.innerHTML = "";
      DOMAINS.forEach(d=>{
        const btn = document.createElement("button");
        btn.className = "tile";
        btn.type = "button";
        btn.innerHTML = `
          <span class="left">
            <span class="name">${escapeHtml(d.name)}</span>
            <span class="tag">${escapeHtml(d.tag || "")}</span>
          </span>
          <span class="chev">›</span>
        `;
        btn.addEventListener("click", ()=>{
          const st = loadState();
          st.mode = "items";
          st.domainId = d.id;
          saveState(st);
          renderItems(d.id);
        });
        grid.appendChild(btn);
      });
    }

    function renderItems(domainId){
      const domain = DOMAINS.find(x=>x.id === domainId);
      if(!domain){ renderDomains(); return; }

      navHeader.textContent = domain.name;
      navSub.textContent = "Choose a district (sub-buttons).";
      backBtn.style.display = "inline-flex";

      grid.innerHTML = "";
      domain.items.forEach(it=>{
        const btn = document.createElement("button");
        btn.className = "tile";
        btn.type = "button";
        btn.innerHTML = `
          <span class="left">
            <span class="name">${escapeHtml(it.name)}</span>
            <span class="tag">${escapeHtml(it.tag || "")}</span>
          </span>
          <span class="chev">›</span>
        `;
        btn.addEventListener("click", ()=>{
          setFrame(it.url, it.name);
        });
        grid.appendChild(btn);
      });
    }

    backBtn.addEventListener("click", ()=>{
      const st = loadState();
      st.mode = "domains";
      st.domainId = null;
      saveState(st);
      renderDomains();
    });

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    // =========================
    // SHARE BUTTON (SAFE)
    // =========================
    document.getElementById("shareBtn").addEventListener("click", async ()=>{
      const url = "https://charlesarin1-creator.github.io/-Agexgrand_plaza/app.html";
      if(navigator.share){
        try{
          await navigator.share({
            title:"AGEx Grand Plaza",
            text:"AGEx is a stewardship ecosystem. Install and explore the districts.",
            url
          });
        }catch(e){
          // user canceled or share failed
        }
      }else{
        try{
          await navigator.clipboard.writeText(url);
          alert("Link copied.");
        }catch(e){
          alert(url);
        }
      }
    });

    // =========================
    // PWA INSTALL BUTTON
    // =========================
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e)=>{
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-flex";
    });

    installBtn.addEventListener("click", async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    // =========================
    // OPEN CURRENT / REFRESH
    // =========================
    function currentUrl(){
      return frame.src || loadState().lastUrl || "";
    }

    function openCurrent(){
      const url = currentUrl();
      if(!url){ alert("Choose a district first."); return; }
      window.open(url, "_blank", "noopener");
    }

    document.getElementById("openNewTabBtn").addEventListener("click", openCurrent);
    document.getElementById("openNewTabBtnTop").addEventListener("click", openCurrent);

    document.getElementById("refreshBtn").addEventListener("click", ()=>{
      try{ frame.contentWindow.location.reload(); }
      catch(e){ frame.src = frame.src; }
    });

    // =========================
    // SIGN OUT
    // =========================
    document.getElementById("signOutBtn").addEventListener("click", async ()=>{
      try{
        await supabaseClient.auth.signOut();
      }catch(e){}
      location.href = "auth.html";
    });

    // =========================
    // INITIAL LOAD
    // =========================
    const st = loadState();

    if(st.mode === "items" && st.domainId){
      renderItems(st.domainId);
    }else{
      renderDomains();
    }

    // If there’s a last opened destination, keep it in frame
    if(st.lastUrl){
      setFrame(st.lastUrl, st.lastLabel || "AGEx");
    }else{
      frameTitle.textContent = "Welcome";
      frameSub.textContent = "Choose a domain above.";
      frame.src = "about:blank";
    }

    // Service worker (optional, if you already have it)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
    }
  </script>
</body>
</html>
