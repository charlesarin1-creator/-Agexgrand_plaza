<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>AGEx — Grand Plaza (App)</title>
  <meta name="description" content="AGEx Grand Plaza — app-body for the ecosystem. Enter once. Navigate everything." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    :root{
      --green:#0B3D2E;
      --gold:#F4B41A;
      --bg:#F7FAF9;
      --card:#FFFFFF;
      --ink:#0F0F0F;
      --muted:#5F6B66;
      --line:rgba(15,15,15,.10);
      --shadow:0 18px 45px rgba(0,0,0,.10);
      --radius:18px;
      --max:1200px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at 15% 0%, rgba(244,180,26,.12), transparent 65%),
        radial-gradient(900px 600px at 85% 10%, rgba(11,61,46,.10), transparent 62%),
        var(--bg);
      overflow:hidden; /* keeps layout stable */
    }
    a{color:inherit;text-decoration:none}

    /* Top Bar */
    .topbar{
      position:sticky;top:0;z-index:60;
      background:rgba(247,250,249,.95);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topbar .inner{
      max-width:var(--max);
      margin:0 auto;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      min-width:220px;
    }
    .mark{
      width:38px;height:38px;border-radius:12px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--green),#083326);
      box-shadow:0 10px 22px rgba(11,61,46,.22);
      flex:0 0 auto;
    }
    .brand b{letter-spacing:.2px}
    .brand .sub{font-size:12px;color:rgba(15,15,15,.62);font-weight:800}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:800;
      font-size:12px;
      color:rgba(15,15,15,.72);
      max-width:520px;
    }
    .pill .dot{
      width:10px;height:10px;border-radius:99px;background:var(--gold);
      box-shadow:0 0 0 4px rgba(244,180,26,.16)
    }
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--line);
      font-weight:900;
      background:#fff;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn.gold{background:var(--gold);border-color:rgba(244,180,26,.65)}
    .btn.ghost{background:transparent}

    /* Main Layout */
    .wrap{
      height:calc(100vh - 62px);
      max-width:var(--max);
      margin:0 auto;
      padding:12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* NAV ALWAYS VISIBLE (TOP) */
    .navPanel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .navHead{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      background:#fff;
    }
    .navHead b{color:var(--green)}
    .navHead .hint{font-size:12px;color:rgba(15,15,15,.62);font-weight:800}

    .navGrid{
      padding:12px 14px;
      display:grid;
      gap:10px;
      grid-template-columns:repeat(3, minmax(0, 1fr));
    }
    .navBtn{
      width:100%;
      text-align:left;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:900;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      transition:.12s ease;
    }
    .navBtn small{font-weight:800;color:rgba(15,15,15,.55)}
    .navBtn.active{
      border-color:rgba(244,180,26,.75);
      box-shadow:0 10px 22px rgba(244,180,26,.18);
    }
    .navBtn:hover{transform:translateY(-1px)}

    /* Frame */
    .framePanel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 0; /* important for flex iframe */
      flex:1;
    }
    .frameTop{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
    }
    .frameTitle{
      display:flex;flex-direction:column;gap:4px;
      min-width:0;
    }
    .frameTitle b{color:var(--green)}
    .frameTitle span{
      font-size:12px;color:rgba(15,15,15,.6);font-weight:750;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      max-width:70vw;
    }
    .frameActions{display:flex;gap:10px;flex-wrap:wrap}

    iframe{
      width:100%;
      border:0;
      flex:1;
      background:#fff;
    }

    /* Mobile */
    @media (max-width: 980px){
      .pill{display:none}
      .navGrid{grid-template-columns:repeat(2, minmax(0, 1fr))}
      .frameTitle span{max-width:62vw}
    }
    @media (max-width: 420px){
      .navGrid{grid-template-columns:1fr}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 2.6l8 3.2v6.2c0 5.1-3.5 9.2-8 9.9-4.5-.7-8-4.8-8-9.9V5.8L12 2.6z" stroke="rgba(255,255,255,.92)" stroke-width="1.6"/>
            <path d="M8.3 12h6.9l-2.2-2.2 1.3-1.3 4.4 4.4-4.4 4.4-1.3-1.3 2.2-2.2H8.3V12z" fill="#F4B41A"/>
          </svg>
        </div>
        <div>
          <b>AGEx</b><br/>
          <span class="sub">Grand Plaza • App Body</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <div class="pill"><span class="dot"></span> Navigation is always visible. Content opens below.</div>
        <button class="btn gold" id="installBtn" style="display:none">Install App</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <!-- NAV (TOP) -->
    <section class="navPanel" aria-label="AGEx City Map">
      <div class="navHead">
        <div>
          <b>The City Map</b>
          <span class="hint">Tap a district. It opens below.</span>
        </div>
        <button class="btn ghost" id="openNewTabBtn" type="button">Open current in new tab</button>
      </div>

      <div class="navGrid" id="nav">
        <!-- IMPORTANT:
             mode="frame" opens inside the app
             mode="newtab" opens outside the app (more reliable for some sites)
        -->

        <button class="navBtn active" data-label="Grand Plaza (Home)" data-url="plaza.html" data-mode="frame">
          Grand Plaza <small>Home</small>
        </button>

        <button class="navBtn" data-label="Smart Money Hub" data-url="https://charlesarin101.github.io/agexsmartmoneyhub/" data-mode="frame">
          Smart Money Hub <small>Academy</small>
        </button>

        <button class="navBtn" data-label="Steward’s Lodge Gate" data-url="https://charlesarin101.github.io/agexsmartmoneyhub/lodge.html?v=2" data-mode="newtab">
          Steward’s Lodge Gate <small>Enter</small>
        </button>

        <button class="navBtn" data-label="The Steward’s Charter" data-url="https://charlesarin101.github.io/the-stewards-charter/" data-mode="frame">
          The Steward’s Charter <small>Finance</small>
        </button>

        <button class="navBtn" data-label="The Stigweard’s Provision" data-url="https://charlesarin1-creator.github.io/the-stigweards-provisions/" data-mode="frame">
          The Stigweard’s Provision <small>Provision</small>
        </button>

        <button class="navBtn" data-label="Arin’s Global Marketplace" data-url="https://selfany.com/s/arinsglobalmarketplace" data-mode="newtab">
          Arin’s Global Marketplace <small>Store</small>
        </button>

        <button class="navBtn" data-label="Christian Child Academy" data-url="https://charlesarin101.github.io/christianchildacademy_zaria/" data-mode="frame">
          Christian Child Academy <small>Education</small>
        </button>

        <button class="navBtn" data-label="Income Streams Lab" data-url="https://charlesarin101.github.io/Income_streams_lab/" data-mode="frame">
          Income Streams Lab <small>Lab</small>
        </button>

        <button class="navBtn" data-label="BigSharks" data-url="https://charlesarin1-creator.github.io/bigsharks-site/" data-mode="frame">
          BigSharks <small>Project</small>
        </button>
      </div>
    </section>

    <!-- CONTENT (BELOW) -->
    <section class="framePanel" aria-label="AGEx Content Viewer">
      <div class="frameTop">
        <div class="frameTitle">
          <b id="frameTitle">Grand Plaza</b>
          <span id="frameSub">Loading…</span>
        </div>
        <div class="frameActions">
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
        </div>
      </div>

      <iframe id="frame" title="AGEx Content" loading="lazy"></iframe>
    </section>
  </div>

<script>
  // ===== PWA install prompt (Android/Chrome) =====
  let deferredPrompt = null;
  const installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "inline-flex";
  });
  installBtn.addEventListener("click", async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = "none";
  });

  // ===== Navigation =====
  const nav = document.getElementById("nav");
  const frame = document.getElementById("frame");
  const frameTitle = document.getElementById("frameTitle");
  const frameSub = document.getElementById("frameSub");

  const stateKey = "AGEX_APP_LAST_TARGET_V2";

  function setActive(btn){
    [...nav.querySelectorAll("button.navBtn")].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function setFrame(url, label){
    frame.src = url;
    frameTitle.textContent = label || "AGEx";
    frameSub.textContent = url;
  }

  function go(btn){
    const url = btn.getAttribute("data-url");
    const label = btn.getAttribute("data-label") || btn.textContent.replace(/\s+/g," ").trim();
    const mode = (btn.getAttribute("data-mode") || "frame").toLowerCase();

    setActive(btn);

    // Save the selection
    localStorage.setItem(stateKey, JSON.stringify({url, label, mode}));

    if(mode === "newtab"){
      // Open externally, keep current frame unchanged (avoids iframe restrictions)
      window.open(url, "_blank", "noopener");
      frameSub.textContent = "Opened in new tab: " + url;
      frameTitle.textContent = label;
      return;
    }

    setFrame(url, label);
  }

  nav.addEventListener("click", (e)=>{
    const btn = e.target.closest("button.navBtn");
    if(!btn) return;
    go(btn);
  });

  document.getElementById("refreshBtn").addEventListener("click", ()=>{
    try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = frame.src; }
  });

  document.getElementById("openNewTabBtn").addEventListener("click", ()=>{
    const url = frame.src || "";
    if(!url) return;
    window.open(url, "_blank", "noopener");
  });

  // ===== First load =====
  // IMPORTANT: you must create plaza.html (see note below)
  const fallback = { url: "plaza.html", label: "Grand Plaza (Home)", mode: "frame" };

  let last = null;
  try{ last = JSON.parse(localStorage.getItem(stateKey) || "null"); }catch(e){ last = null; }
  const start = (last && last.url) ? last : fallback;

  // highlight matching button if possible
  const match = [...nav.querySelectorAll("button.navBtn")]
    .find(b => b.getAttribute("data-url") === start.url);

  if(match) go(match);
  else setFrame(start.url, start.label);

  // ===== Service Worker registration =====
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  }
</script>

</body>
</html>
