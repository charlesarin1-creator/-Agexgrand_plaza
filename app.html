<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>AGEx — Grand Plaza (App)</title>
  <meta name="description" content="AGEx Grand Plaza — app-body for the ecosystem. Enter once. Navigate everything." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    :root{
      --green:#0B3D2E;
      --green2:#083326;
      --gold:#F4B41A;
      --bg:#F7FAF9;
      --card:#FFFFFF;
      --ink:#0F0F0F;
      --muted:#5F6B66;
      --line:rgba(15,15,15,.10);
      --shadow:0 18px 45px rgba(0,0,0,.10);
      --radius:20px;
      --max:1100px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--ink);
      background:
        radial-gradient(900px 600px at 15% 0%, rgba(244,180,26,.12), transparent 65%),
        radial-gradient(900px 600px at 85% 10%, rgba(11,61,46,.10), transparent 62%),
        var(--bg);
    }
    a{color:inherit;text-decoration:none}

    /* Topbar */
    .topbar{
      position:sticky;top:0;z-index:60;
      background:rgba(247,250,249,.92);
      backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topbar .inner{
      max-width:var(--max);
      margin:0 auto;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .mark{
      width:40px;height:40px;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--green),var(--green2));
      box-shadow:0 10px 22px rgba(11,61,46,.22);
    }
    .brand b{letter-spacing:.2px}
    .sub{font-size:12px;color:rgba(15,15,15,.62);font-weight:800}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:800;
      font-size:12px;
      color:rgba(15,15,15,.72);
      white-space:nowrap;
    }
    .pill .dot{width:10px;height:10px;border-radius:99px;background:var(--gold);box-shadow:0 0 0 4px rgba(244,180,26,.16)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--line);
      font-weight:900;
      background:#fff;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn.gold{background:var(--gold);border-color:rgba(244,180,26,.65)}
    .btn.ghost{background:transparent}

    /* App layout: NAV TOP + FRAME BOTTOM */
    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
      min-height:calc(100vh - 64px);
    }

    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* NAV panel takes at most ~1/3 of screen */
    .navPanel{
      max-height:34vh;        /* <= one third */
      overflow:auto;          /* scroll only inside nav panel if needed */
    }
    .navHead{
      padding:14px 14px 10px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--line);
      background:#fff;
    }
    .navHead h1{
      margin:0;
      font-size:18px;
      color:var(--green);
      letter-spacing:-.2px;
    }
    .navHead p{
      margin:6px 0 0;
      color:rgba(15,15,15,.62);
      font-weight:700;
      font-size:13px;
      line-height:1.35;
    }
    .navHeadRight{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    /* Compact grid */
    .navGrid{
      padding:12px 14px;
      display:grid;
      gap:10px;
      grid-template-columns:repeat(3, minmax(0, 1fr)); /* 9 items => 3x3 perfect */
    }

    .tile{
      border:1px solid var(--line);
      background:#fff;
      border-radius:16px;
      padding:10px 10px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      min-height:54px;
      transition:.12s ease;
    }
    .tile:hover{transform:translateY(-1px)}
    .tile.active{
      border-color:rgba(244,180,26,.70);
      box-shadow:0 10px 22px rgba(244,180,26,.18);
    }
    .tile .left{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }
    .tile .name{
      font-weight:950;
      color:#111;
      font-size:13px;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tile .tag{
      font-weight:850;
      color:rgba(15,15,15,.55);
      font-size:11px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .tile .chev{
      font-weight:950;
      color:rgba(11,61,46,.85);
      opacity:.8;
      flex:0 0 auto;
    }

    /* Frame panel gets the rest */
    .framePanel{
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:52vh;
    }
    .frameTop{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fff;
    }
    .frameTop .title{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }
    .frameTop .title b{color:var(--green)}
    .frameTop .title span{
      font-size:12px;
      color:rgba(15,15,15,.60);
      font-weight:750;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:72vw;
    }
    .frameBtns{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    iframe{
      width:100%;
      flex:1;
      border:0;
      background:#fff;
    }

    /* Mobile: 2 columns for comfort */
    @media (max-width: 720px){
      .navGrid{grid-template-columns:repeat(2, minmax(0, 1fr))}
      .navPanel{max-height:38vh}
    }
    @media (max-width: 420px){
      .navGrid{grid-template-columns:1fr}
      .frameTop .title span{max-width:62vw}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 2.6l8 3.2v6.2c0 5.1-3.5 9.2-8 9.9-4.5-.7-8-4.8-8-9.9V5.8L12 2.6z" stroke="rgba(255,255,255,.92)" stroke-width="1.6"/>
            <path d="M8.3 12h6.9l-2.2-2.2 1.3-1.3 4.4 4.4-4.4 4.4-1.3-1.3 2.2-2.2H8.3V12z" fill="#F4B41A"/>
          </svg>
        </div>
        <div>
          <b>AGEx</b><br/>
          <span class="sub">Grand Plaza • App Body</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <div class="pill"><span class="dot"></span> Tap a district. It opens below.</div>
        <button class="btn gold" id="installBtn" style="display:none">Install App</button>
        <a class="btn ghost" href="./" title="Open original plaza page">Open Plaza</a>
      </div>
    </div>
  </div>

  <div class="wrap">

    <!-- NAV TOP -->
    <section class="panel navPanel" aria-label="City map navigation">
      <div class="navHead">
        <div>
          <h1>The City Map</h1>
          <p>Choose your next district. The page loads in the display area below.</p>
        </div>
        <div class="navHeadRight">
          <button class="btn" id="openNewTabBtnTop" type="button">Open current in new tab</button>
        </div>
      </div>

      <div class="navGrid" id="nav">

        <!-- ORDERED FOR LEARNERS -->
        <button class="tile active" data-url="https://charlesarin101.github.io/agexsmartmoneyhub/" data-title="Smart Money Hub" data-tag="Academy">
          <span class="left">
            <span class="name">Smart Money Hub</span>
            <span class="tag">Academy</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://charlesarin101.github.io/agexsmartmoneyhub/lodge.html?v=2" data-title="Steward’s Lodge Gate" data-tag="Enter">
          <span class="left">
            <span class="name">Steward’s Lodge Gate</span>
            <span class="tag">Enter</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://charlesarin101.github.io/the-stewards-charter/" data-title="The Steward’s Charter" data-tag="Finance">
          <span class="left">
            <span class="name">The Steward’s Charter</span>
            <span class="tag">Finance</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://charlesarin101.github.io/Income_streams_lab/" data-title="Income Streams Lab" data-tag="Lab">
          <span class="left">
            <span class="name">Income Streams Lab</span>
            <span class="tag">Lab</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://charlesarin1-creator.github.io/the-stigweards-provisions/" data-title="The Stigweard’s Provision" data-tag="Provision">
          <span class="left">
            <span class="name">The Stigweard’s Provision</span>
            <span class="tag">Provision</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://selfany.com/s/arinsglobalmarketplace" data-title="Arin’s Global Marketplace" data-tag="Store">
          <span class="left">
            <span class="name">Arin’s Global Marketplace</span>
            <span class="tag">Store</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://charlesarin1-creator.github.io/bigsharks-site/" data-title="BigSharks" data-tag="Project">
          <span class="left">
            <span class="name">BigSharks</span>
            <span class="tag">Project</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="https://charlesarin101.github.io/christianchildacademy_zaria/" data-title="Christian Child Academy" data-tag="Education">
          <span class="left">
            <span class="name">Christian Child Academy</span>
            <span class="tag">Education</span>
          </span>
          <span class="chev">›</span>
        </button>

        <button class="tile" data-url="./" data-title="Grand Plaza" data-tag="Home">
          <span class="left">
            <span class="name">Grand Plaza</span>
            <span class="tag">Home</span>
          </span>
          <span class="chev">›</span>
        </button>

        <!-- OPTIONAL ADMIN TILE (hidden unless you unlock it below)
        <button class="tile" data-url="admin.html" data-title="Admin Console" data-tag="Keys" id="adminTile">
          <span class="left">
            <span class="name">Admin Console</span>
            <span class="tag">Keys</span>
          </span>
          <span class="chev">›</span>
        </button>
        -->

      </div>
    </section>

    <!-- DISPLAY DOWN -->
    <section class="panel framePanel" aria-label="Display area">
      <div class="frameTop">
        <div class="title">
          <b id="frameTitle">Smart Money Hub</b>
          <span id="frameSub">Loading…</span>
        </div>
        <div class="frameBtns">
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
          <button class="btn" id="openNewTabBtn" type="button">Open current in new tab</button>
        </div>
      </div>
      <iframe id="frame" title="AGEx Content"></iframe>
    </section>

  </div>

<script>
  // ===== PWA install prompt (Android/Chrome) =====
  let deferredPrompt = null;
  const installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "inline-flex";
  });
  installBtn.addEventListener("click", async () => {
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = "none";
  });

  // ===== App Shell Navigation =====
  const nav = document.getElementById("nav");
  const frame = document.getElementById("frame");
  const frameTitle = document.getElementById("frameTitle");
  const frameSub = document.getElementById("frameSub");
  const stateKey = "AGEX_APP_LAST_URL";

  function setActive(btn){
    [...nav.querySelectorAll("button.tile")].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function setFrame(url, title, tag){
    frame.src = url;
    frameTitle.textContent = title || "AGEx";
    frameSub.textContent = tag ? (tag + " • " + url) : url;
    localStorage.setItem(stateKey, url);
  }

  nav.addEventListener("click", (e)=>{
    const btn = e.target.closest("button.tile[data-url]");
    if(!btn) return;
    const url = btn.getAttribute("data-url");
    const title = btn.getAttribute("data-title") || "AGEx";
    const tag = btn.getAttribute("data-tag") || "";
    setActive(btn);
    setFrame(url, title, tag);
  });

  function openCurrent(){
    const url = frame.src || localStorage.getItem(stateKey) || "https://charlesarin101.github.io/agexsmartmoneyhub/";
    window.open(url, "_blank", "noopener");
  }

  document.getElementById("openNewTabBtn").addEventListener("click", openCurrent);
  document.getElementById("openNewTabBtnTop").addEventListener("click", openCurrent);

  document.getElementById("refreshBtn").addEventListener("click", ()=>{
    try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = frame.src; }
  });

  // ===== Admin visibility (optional) =====
  // If you later want Admin inside the app, uncomment the Admin tile in HTML,
  // then require a local unlock on YOUR device only:
  // localStorage.setItem("AGEX_ADMIN_OK","1");
  // and only then show the tile.
  // const adminTile = document.getElementById("adminTile");
  // if(adminTile){
  //   adminTile.style.display = (localStorage.getItem("AGEX_ADMIN_OK")==="1") ? "flex" : "none";
  // }

  // ===== Load last visited or default =====
  const defaultUrl = "https://charlesarin101.github.io/agexsmartmoneyhub/";
  const last = localStorage.getItem(stateKey) || defaultUrl;

  const match = [...nav.querySelectorAll("button.tile[data-url]")].find(b => b.getAttribute("data-url") === last);
  if(match){
    setActive(match);
    setFrame(last, match.getAttribute("data-title"), match.getAttribute("data-tag"));
  }else{
    const first = nav.querySelector("button.tile[data-url]");
    setActive(first);
    setFrame(first.getAttribute("data-url"), first.getAttribute("data-title"), first.getAttribute("data-tag"));
  }

  // ===== Service Worker =====
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  }
</script>
</body>
</html>
