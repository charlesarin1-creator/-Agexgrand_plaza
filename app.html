<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>AGEx — Grand Plaza (App)</title>
  <meta name="description" content="AGEx Grand Plaza — a life operating system. Sign in, then navigate the domains." />
  <meta name="robots" content="index,follow" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <style>
    :root{
      --green:#0B3D2E;
      --green2:#083326;
      --green3:#114B39;
      --gold:#F4B41A;
      --gold2:#d79d13;
      --white:#ffffff;
      --muted:rgba(255,255,255,.78);
      --line:rgba(255,255,255,.14);
      --shadow:0 18px 45px rgba(0,0,0,.35);
      --radius:22px;
      --max:1100px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--white);
      background:
        radial-gradient(900px 600px at 14% 0%, rgba(244,180,26,.12), transparent 65%),
        radial-gradient(900px 650px at 86% 12%, rgba(255,255,255,.08), transparent 60%),
        radial-gradient(700px 520px at 50% 95%, rgba(0,0,0,.22), transparent 65%),
        linear-gradient(160deg, var(--green3) 0%, var(--green) 45%, var(--green2) 100%);
    }
    a{color:inherit;text-decoration:none}
    button{font-family:inherit}

    /* Top bar */
    .topbar{
      position:sticky;top:0;z-index:60;
      background:rgba(11,61,46,.78);
      backdrop-filter:saturate(160%) blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topbar .inner{
      max-width:var(--max);
      margin:0 auto;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{
      width:40px;height:40px;border-radius:14px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--green3),var(--green2));
      box-shadow:0 10px 22px rgba(0,0,0,.30);
      border:1px solid rgba(255,255,255,.10);
      flex:0 0 auto;
    }
    .brandTitle{min-width:0}
    .brandTitle b{letter-spacing:.2px}
    .sub{font-size:12px;color:rgba(255,255,255,.75);font-weight:800}

    .actions{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end
    }

    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--line);
      font-weight:900;
      background:rgba(255,255,255,.06);
      color:var(--white);
      cursor:pointer;
      white-space:nowrap;
      transition:.15s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn.gold{
      background:linear-gradient(180deg, var(--gold) 0%, var(--gold2) 100%);
      border-color:rgba(244,180,26,.55);
      color:#0b0b0b;
      box-shadow:0 10px 22px rgba(244,180,26,.18);
    }
    .btn.ghost{background:transparent}

    /* Layout */
    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
      min-height:calc(100vh - 64px);
    }

    .panel{
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      background:rgba(255,255,255,.05);
    }

    /* Dashboard (top 2/3) */
    .dashPanel{
      padding:14px;
    }
    .dashGrid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
    }
    .domainBtn{
      width:100%;
      border:none;
      border-radius:18px;
      padding:18px 14px;
      cursor:pointer;
      background:linear-gradient(180deg, var(--gold) 0%, var(--gold2) 100%);
      color:#0b0b0b;
      font-weight:950;
      text-align:left;
      box-shadow:0 10px 22px rgba(0,0,0,.25);
      transition:.15s ease;
      position:relative;
      overflow:hidden;
    }
    .domainBtn:before{
      content:"";
      position:absolute;inset:-40% -30%;
      background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 45%);
      transform:rotate(8deg);
      opacity:.75;
      pointer-events:none;
    }
    .domainBtn:active{transform:scale(.98)}
    .domainTop{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .domainName{font-size:16px;letter-spacing:.2px}
    .chev{font-weight:950;opacity:.85}
    .domainHint{
      margin-top:6px;
      font-size:12px;
      font-weight:850;
      color:rgba(0,0,0,.72);
    }

    /* Sub-screen */
    .subPanel{
      display:none;
      padding:14px;
    }
    .subHead{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin-bottom:12px;
    }
    .subHead b{font-size:16px}
    .subGrid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
    }
    .subBtn{
      width:100%;
      border:1px solid rgba(255,255,255,.22);
      border-radius:18px;
      padding:14px 14px;
      cursor:pointer;
      background:rgba(255,255,255,.06);
      color:var(--white);
      font-weight:900;
      text-align:left;
      transition:.15s ease;
    }
    .subBtn:hover{transform:translateY(-1px)}
    .subBtn:active{transform:translateY(0)}
    .subTag{display:block;margin-top:6px;color:rgba(255,255,255,.75);font-size:12px;font-weight:800}

    /* Viewer (bottom 1/3) */
    .viewerPanel{
      display:flex;
      flex-direction:column;
      min-height:34vh;
      background:rgba(0,0,0,.12);
    }
    .viewerTop{
      padding:12px 14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:rgba(255,255,255,.04);
    }
    .viewerTitle{
      display:flex;flex-direction:column;gap:4px;min-width:0
    }
    .viewerTitle b{color:var(--white)}
    .viewerTitle span{
      font-size:12px;
      color:rgba(255,255,255,.72);
      font-weight:750;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:72vw;
    }
    .viewerBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    iframe{
      width:100%;
      flex:1;
      border:0;
      background:#fff;
    }

    /* Footer (policy + support) */
    .footerPanel{
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      background:rgba(255,255,255,.04);
    }
    .links{
      display:flex;gap:12px;flex-wrap:wrap;align-items:center;
      color:rgba(255,255,255,.86);
      font-weight:850;
      font-size:12px;
    }
    .links a{opacity:.95;text-decoration:underline;text-underline-offset:3px}
    .status{
      font-size:12px;
      font-weight:850;
      color:rgba(255,255,255,.78);
    }

    /* Mobile tweaks */
    @media (min-width: 860px){
      .dashGrid{grid-template-columns:repeat(4, minmax(0,1fr))}
      .subGrid{grid-template-columns:repeat(3, minmax(0,1fr))}
    }
  </style>
</head>

<body>
  <!-- Top bar -->
  <div class="topbar">
    <div class="inner">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 2.6l8 3.2v6.2c0 5.1-3.5 9.2-8 9.9-4.5-.7-8-4.8-8-9.9V5.8L12 2.6z" stroke="rgba(255,255,255,.92)" stroke-width="1.6"/>
            <path d="M8.3 12h6.9l-2.2-2.2 1.3-1.3 4.4 4.4-4.4 4.4-1.3-1.3 2.2-2.2H8.3V12z" fill="#F4B41A"/>
          </svg>
        </div>
        <div class="brandTitle">
          <b>AGEx</b><br/>
          <span class="sub">Grand Plaza • App</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="shareBtn" type="button">Share</button>
        <button class="btn gold" id="installBtn" type="button" style="display:none">Install</button>
        <button class="btn" id="signOutBtn" type="button">Sign out</button>
      </div>
    </div>
  </div>

  <div class="wrap">

    <!-- Dashboard (2/3-ish) -->
    <section class="panel dashPanel" aria-label="AGEx domains dashboard">
      <div id="dashView">
        <div class="dashGrid">

          <!-- FINANCE -->
          <button class="domainBtn" type="button" data-domain="finance">
            <div class="domainTop">
              <div class="domainName">Finance</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Smart Money Hub • Income Streams Lab • BigSharks</div>
          </button>

          <!-- HOME -->
          <button class="domainBtn" type="button" data-domain="home">
            <div class="domainTop">
              <div class="domainName">Home</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Steward’s Charter • HomExecutive</div>
          </button>

          <!-- MARKETPLACE -->
          <button class="domainBtn" type="button" data-domain="marketplace">
            <div class="domainTop">
              <div class="domainName">Marketplace</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Arin’s Global Marketplace</div>
          </button>

          <!-- EXCHANGE LIFE -->
          <button class="domainBtn" type="button" data-domain="exchange">
            <div class="domainTop">
              <div class="domainName">Exchange Life</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Kingdom MTT 6:33</div>
          </button>

          <!-- MEDIA -->
          <button class="domainBtn" type="button" data-domain="media">
            <div class="domainTop">
              <div class="domainName">Media</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">iService (Media/IT)</div>
          </button>

          <!-- LOGISTICS -->
          <button class="domainBtn" type="button" data-domain="logistics">
            <div class="domainTop">
              <div class="domainName">Logistics</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Ringo</div>
          </button>

          <!-- FOUNDATION (COMING SOON) -->
          <button class="domainBtn" type="button" data-domain="foundation">
            <div class="domainTop">
              <div class="domainName">Foundation</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Coming soon</div>
          </button>

          <!-- EDUCATION (COMING SOON) -->
          <button class="domainBtn" type="button" data-domain="education">
            <div class="domainTop">
              <div class="domainName">Education</div>
              <div class="chev">›</div>
            </div>
            <div class="domainHint">Coming soon</div>
          </button>

        </div>
      </div>

      <!-- Sub-screen -->
      <div class="subPanel" id="subView">
        <div class="subHead">
          <button class="btn" id="backBtn" type="button">‹ Back</button>
          <b id="subTitle">Domain</b>
          <button class="btn" id="openNewTabBtnTop" type="button">Open</button>
        </div>
        <div class="subGrid" id="subGrid"></div>
      </div>
    </section>

    <!-- Viewer (bottom area) -->
    <section class="panel viewerPanel" aria-label="Display area">
      <div class="viewerTop">
        <div class="viewerTitle">
          <b id="viewerTitle">Welcome</b>
          <span id="viewerSub">Select a domain to begin.</span>
        </div>
        <div class="viewerBtns">
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
          <button class="btn" id="openNewTabBtn" type="button">Open</button>
        </div>
      </div>
      <iframe id="frame" title="AGEx Viewer"></iframe>
    </section>

    <!-- Footer: policies + support -->
    <section class="panel footerPanel" aria-label="Footer links">
      <div class="links">
        <a href="support.html" target="_blank" rel="noopener">Support</a>
        <a href="privacy.html" target="_blank" rel="noopener">Privacy</a>
        <a href="terms.html" target="_blank" rel="noopener">Terms</a>
      </div>
      <div class="status" id="statusText">Signed in required for member areas.</div>
    </section>

  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    // =========================
    // 1) AUTH GUARD
    // =========================
    (async function(){
      try{
        const { data } = await supabaseClient.auth.getSession();
        const session = data?.session;

        if(!session){
          location.href = "auth.html";
          return;
        }

        // Keep this page in sync if auth changes
        supabaseClient.auth.onAuthStateChange((_event, newSession) => {
          if(!newSession){
            location.href = "auth.html";
          }
        });

      }catch(e){
        // If anything fails, push to auth to be safe
        location.href = "auth.html";
      }
    })();

    // =========================
    // 2) DOMAIN + SUB-PAGES MAP
    // =========================
    const DOMAINS = {
      finance: {
        title: "Finance",
        items: [
          { title:"Smart Money Hub", tag:"Academy", url:"https://charlesarin101.github.io/agexsmartmoneyhub/" },
          { title:"Income Streams Lab", tag:"Lab", url:"https://charlesarin101.github.io/Income_streams_lab/" },
          { title:"BigSharks", tag:"Project", url:"https://charlesarin1-creator.github.io/bigsharks-site/" }
        ]
      },
      home: {
        title: "Home",
        items: [
          { title:"The Steward’s Charter", tag:"Home/Family", url:"https://charlesarin101.github.io/the-stewards-charter/" },
          { title:"HomExecutive", tag:"Home Services", url:"https://charlesarin1-creator.github.io/HomExecutive/" }
        ]
      },
      marketplace: {
        title: "Marketplace",
        items: [
          { title:"Arin’s Global Marketplace", tag:"Store", url:"https://selfany.com/s/arinsglobalmarketplace" }
        ]
      },
      exchange: {
        title: "Exchange Life",
        items: [
          { title:"Kingdom MTT 6:33", tag:"Life / Encounters", url:"https://charlesarin1-creator.github.io/Kingdom-mtt633/" }
        ]
      },
      media: {
        title: "Media",
        items: [
          { title:"iService", tag:"Media/IT", url:"https://charlesarin1-creator.github.io/iservice.com/" }
        ]
      },
      logistics: {
        title: "Logistics",
        items: [
          { title:"Ringo", tag:"Logistics", url:"https://charlesarin1-creator.github.io/Ringo.com/" }
        ]
      },
      foundation: {
        title: "Foundation",
        items: [
          { title:"Coming Soon", tag:"Foundation", url:"coming-soon.html" }
        ]
      },
      education: {
        title: "Education",
        items: [
          { title:"Coming Soon", tag:"Education", url:"coming-soon.html" }
        ]
      }
    };

    // =========================
    // 3) VIEW HELPERS
    // =========================
    const dashView = document.getElementById("dashView");
    const subView  = document.getElementById("subView");
    const subTitle = document.getElementById("subTitle");
    const subGrid  = document.getElementById("subGrid");

    const frame = document.getElementById("frame");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerSub = document.getElementById("viewerSub");

    const stateKey = "AGEX_LAST_URL";
    const stateTitleKey = "AGEX_LAST_TITLE";
    const stateTagKey = "AGEX_LAST_TAG";

    function setViewer(url, title, tag){
      frame.src = url;
      viewerTitle.textContent = title || "AGEx";
      viewerSub.textContent = (tag ? (tag + " • ") : "") + url;
      localStorage.setItem(stateKey, url);
      localStorage.setItem(stateTitleKey, title || "AGEx");
      localStorage.setItem(stateTagKey, tag || "");
    }

    function openCurrent(){
      const url = frame.src || localStorage.getItem(stateKey);
      if(url) window.open(url, "_blank", "noopener");
    }

    function showSub(domainKey){
      const domain = DOMAINS[domainKey];
      if(!domain) return;

      // Build sub buttons
      subGrid.innerHTML = "";
      subTitle.textContent = domain.title;

      domain.items.forEach(item=>{
        const btn = document.createElement("button");
        btn.className = "subBtn";
        btn.type = "button";
        btn.innerHTML = `
          <div>${item.title}</div>
          <span class="subTag">${item.tag || ""}</span>
        `;
        btn.addEventListener("click", ()=>{
          setViewer(item.url, item.title, item.tag);
        });
        subGrid.appendChild(btn);
      });

      dashView.style.display = "none";
      subView.style.display = "block";
    }

    function showDash(){
      subView.style.display = "none";
      dashView.style.display = "block";
    }

    // Dashboard click
    document.querySelectorAll(".domainBtn[data-domain]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.getAttribute("data-domain");
        showSub(key);
      });
    });

    // Back
    document.getElementById("backBtn").addEventListener("click", showDash);

    // Viewer controls
    document.getElementById("openNewTabBtn").addEventListener("click", openCurrent);
    document.getElementById("openNewTabBtnTop").addEventListener("click", openCurrent);
    document.getElementById("refreshBtn").addEventListener("click", ()=>{
      try{ frame.contentWindow.location.reload(); }catch(e){ frame.src = frame.src; }
    });

    // Restore last viewed
    (function restore(){
      const lastUrl = localStorage.getItem(stateKey);
      if(lastUrl){
        setViewer(
          lastUrl,
          localStorage.getItem(stateTitleKey) || "AGEx",
          localStorage.getItem(stateTagKey) || ""
        );
      }
    })();

    // =========================
    // 4) SHARE BUTTON
    // =========================
    document.getElementById("shareBtn").addEventListener("click", async ()=>{
      const url = location.href;
      if(navigator.share){
        try{
          await navigator.share({
            title: "AGEx Grand Plaza",
            text: "AGEx — a life operating system. Install it and explore the domains.",
            url
          });
        }catch(e){}
      }else{
        try{
          await navigator.clipboard.writeText(url);
          alert("Link copied to clipboard.");
        }catch(e){
          prompt("Copy this link:", url);
        }
      }
    });

    // =========================
    // 5) SIGN OUT
    // =========================
    document.getElementById("signOutBtn").addEventListener("click", async ()=>{
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      location.href = "auth.html";
    });

    // =========================
    // 6) PWA INSTALL BUTTON
    // =========================
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-flex";
    });

    installBtn.addEventListener("click", async () => {
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    // =========================
    // 7) SERVICE WORKER
    // =========================
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
    }
  </script>
</body>
</html>
