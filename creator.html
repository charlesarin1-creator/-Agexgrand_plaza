<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0B3D2E" />
  <title>Creator Room — AGEx</title>
  <style>
    :root{--green:#0B3D2E;--gold:#F4B41A;--bg:#F4F7F6;--card:#fff;--line:rgba(0,0,0,.10);--ink:#111;--muted:#5f6b66;--r:18px}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}
    header{position:sticky;top:0;background:rgba(244,247,246,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:980px;margin:0 auto;padding:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    .brand{display:flex;gap:10px;align-items:center}
    .mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--green),#083326);display:grid;place-items:center;color:#fff;font-weight:900}
    .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}
    .btn.gold{background:var(--gold);border-color:rgba(244,180,26,.6)}
    .btn.dark{background:var(--green);border-color:var(--green);color:#fff}
    .grid{display:grid;gap:12px}
    @media(min-width:900px){.grid.two{grid-template-columns:1fr 1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
    label{display:block;font-weight:900;font-size:12px;margin-top:10px}
    input,textarea,select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:inherit}
    textarea{min-height:90px;resize:vertical}
    .muted{color:rgba(0,0,0,.6);font-weight:700;font-size:13px;line-height:1.4}
    .list{display:grid;gap:10px;margin-top:10px}
    .item{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .item b{color:var(--green)}
    .pill{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-weight:900;font-size:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .hr{height:1px;background:var(--line);margin:12px 0}
    .ok{color:var(--green);font-weight:900}
    .bad{color:#b42318;font-weight:900}
    a{color:inherit;text-decoration:none}
  </style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="row">
      <div class="brand">
        <div class="mark">AG</div>
        <div>
          <div style="font-weight:1000;letter-spacing:.2px">Creator Room</div>
          <div class="muted">Create tasks • Approve proof • Credit SP + A1</div>
        </div>
      </div>
      <div class="actions">
        <a class="btn" href="app.html">Back to App</a>
        <button class="btn dark" id="signOut">Sign out</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">

  <div class="card" id="statusCard">
    <div class="muted">Checking admin access…</div>
  </div>

  <div class="grid two" style="margin-top:12px">

    <!-- Create Task -->
    <section class="card">
      <h2 style="margin:0;color:var(--green)">Create a Task</h2>
      <p class="muted" style="margin:6px 0 0">
        Tasks appear to Apprentices in the Task Board. Submissions come here for approval.
      </p>

      <label>Title</label>
      <input id="t_title" placeholder="e.g., Outreach: 20 meaningful comments" />

      <label>Category</label>
      <select id="t_cat">
        <option value="general">General</option>
        <option value="outreach">Outreach</option>
        <option value="content">Content</option>
        <option value="research">Research</option>
        <option value="community">Community</option>
      </select>

      <label>Description</label>
      <textarea id="t_desc" placeholder="Write what they must do, and what proof is required."></textarea>

      <div class="grid two" style="margin-top:10px">
        <div>
          <label>Reward Skill Points (SP)</label>
          <input id="t_sp" type="number" inputmode="numeric" value="200" />
        </div>
        <div>
          <label>Reward A1 Coins</label>
          <input id="t_a1" type="number" inputmode="numeric" value="0" />
        </div>
      </div>

      <label style="display:flex;gap:10px;align-items:center;margin-top:12px">
        <input type="checkbox" id="t_approval" checked style="width:auto" />
        <span class="muted" style="margin:0">Requires approval (recommended)</span>
      </label>

      <div class="actions">
        <button class="btn gold" id="createTask">Create Task</button>
        <button class="btn" id="refreshTasks">Refresh</button>
      </div>

      <div class="muted" id="taskMsg" style="margin-top:10px"></div>
      <div class="hr"></div>

      <h3 style="margin:0;color:var(--green)">Active Tasks</h3>
      <div class="list" id="tasksList"></div>
    </section>

    <!-- Approvals -->
    <section class="card">
      <h2 style="margin:0;color:var(--green)">Pending Submissions</h2>
      <p class="muted" style="margin:6px 0 0">
        Approve to credit SP + A1 automatically.
      </p>

      <div class="actions" style="margin-top:10px">
        <button class="btn" id="refreshSubs">Refresh</button>
      </div>

      <div class="list" id="subsList"></div>
      <div class="muted" id="subsMsg" style="margin-top:10px"></div>
    </section>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
  const statusCard = document.getElementById("statusCard");
  const tasksList = document.getElementById("tasksList");
  const subsList  = document.getElementById("subsList");
  const taskMsg   = document.getElementById("taskMsg");
  const subsMsg   = document.getElementById("subsMsg");

  function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  async function requireAdmin(){
    const { data: sess } = await supabaseClient.auth.getSession();
    if(!sess?.session){ location.href = "auth.html"; return false; }

    const uid = sess.session.user.id;

    const { data: prof, error } = await supabaseClient
      .from("profiles")
      .select("role, full_name, skill_points, a1_coins")
      .eq("id", uid)
      .single();

    if(error || !prof){
      statusCard.innerHTML = `<div class="bad">Profile missing or blocked: ${esc(error?.message||"")}</div>`;
      return false;
    }

    if(prof.role !== "admin"){
      statusCard.innerHTML = `
        <div class="bad">Access denied. This room is admin-only.</div>
        <div class="muted" style="margin-top:6px">If this is you, set your role to <b>admin</b> in Supabase SQL.</div>
      `;
      return false;
    }

    statusCard.innerHTML = `
      <div class="ok">✅ Admin verified.</div>
      <div class="muted" style="margin-top:6px">
        Signed in as <b>${esc(prof.full_name || sess.session.user.email)}</b>
      </div>
    `;
    return true;
  }

  async function loadTasks(){
    taskMsg.textContent = "Loading tasks…";
    const { data, error } = await supabaseClient
      .from("tasks")
      .select("id, title, category, reward_sp, reward_a1, requires_approval, is_active, created_at")
      .order("created_at", { ascending: false })
      .limit(30);

    if(error){ taskMsg.textContent = "Error: " + error.message; return; }
    taskMsg.textContent = "";

    tasksList.innerHTML = (data || []).map(t => `
      <div class="item">
        <b>${esc(t.title)}</b>
        <div class="muted">Category: ${esc(t.category)} • SP: ${t.reward_sp} • A1: ${t.reward_a1} • Approval: ${t.requires_approval ? "Yes" : "No"}</div>
        <div class="muted">Active: ${t.is_active ? "✅" : "❌"} • ${new Date(t.created_at).toLocaleString()}</div>
      </div>
    `).join("") || `<div class="muted">No tasks yet.</div>`;
  }

  async function createTask(){
    const title = document.getElementById("t_title").value.trim();
    const category = document.getElementById("t_cat").value;
    const description = document.getElementById("t_desc").value.trim();
    const reward_sp = parseInt(document.getElementById("t_sp").value || "0", 10);
    const reward_a1 = parseInt(document.getElementById("t_a1").value || "0", 10);
    const requires_approval = !!document.getElementById("t_approval").checked;

    if(!title || !description){
      taskMsg.innerHTML = `<span class="bad">Title + Description are required.</span>`;
      return;
    }

    taskMsg.textContent = "Creating…";
    const { data: sess } = await supabaseClient.auth.getSession();
    const created_by = sess?.session?.user?.id || null;

    const { error } = await supabaseClient.from("tasks").insert([{
      title, category, description, reward_sp, reward_a1, requires_approval, created_by
    }]);

    if(error){ taskMsg.innerHTML = `<span class="bad">Error: ${esc(error.message)}</span>`; return; }

    taskMsg.innerHTML = `<span class="ok">✅ Task created.</span>`;
    document.getElementById("t_title").value = "";
    document.getElementById("t_desc").value = "";
    await loadTasks();
  }

  async function loadPendingSubs(){
    subsMsg.textContent = "Loading submissions…";

    const { data, error } = await supabaseClient
      .from("task_submissions")
      .select("id, created_at, task_id, user_id, proof_text, proof_url, status, review_note, tasks(title, reward_sp, reward_a1)")
      .eq("status", "pending")
      .order("created_at", { ascending: false })
      .limit(50);

    if(error){ subsMsg.textContent = "Error: " + error.message; return; }
    subsMsg.textContent = "";

    subsList.innerHTML = (data || []).map(s => `
      <div class="item">
        <b>${esc(s.tasks?.title || "Task")}</b>
        <div class="muted">SP: ${s.tasks?.reward_sp ?? 0} • A1: ${s.tasks?.reward_a1 ?? 0}</div>
        <div class="muted">User: <span class="pill">${esc(s.user_id)}</span></div>
        ${s.proof_url ? `<div class="muted">Proof URL: <a class="pill" target="_blank" rel="noopener" href="${esc(s.proof_url)}">Open</a></div>` : ""}
        ${s.proof_text ? `<div class="muted" style="margin-top:6px">Proof Text:<br>${esc(s.proof_text)}</div>` : ""}
        <div class="actions">
          <button class="btn gold" onclick="approveSub('${s.id}', ${s.tasks?.reward_sp ?? 0}, ${s.tasks?.reward_a1 ?? 0}, '${s.user_id}')">Approve + Credit</button>
          <button class="btn" onclick="rejectSub('${s.id}')">Reject</button>
        </div>
      </div>
    `).join("") || `<div class="muted">No pending submissions.</div>`;
  }

  async function approveSub(subId, rewardSP, rewardA1, userId){
    const note = prompt("Approval note (optional):") || "";

    const { data: sess } = await supabaseClient.auth.getSession();
    const reviewer = sess?.session?.user?.id || null;

    // 1) Mark submission approved
    let { error: e1 } = await supabaseClient
      .from("task_submissions")
      .update({ status:"approved", reviewed_at: new Date().toISOString(), reviewed_by: reviewer, review_note: note })
      .eq("id", subId);

    if(e1){ alert("Error approving submission: " + e1.message); return; }

    // 2) Credit wallet
    // NOTE: This requires admin to be able to update profiles; easiest is to do it via SQL RPC later.
    // For now, we do a simple update because admin read-all is allowed; update may be blocked by RLS.
    // If blocked, tell me, and I’ll give you the exact secure RPC function.
    let { error: e2 } = await supabaseClient
      .from("profiles")
      .update({ 
        skill_points: supabaseClient.rpc ? undefined : undefined
      })
      .eq("id", userId);

    // If direct update blocked, use an RPC (recommended secure path)
    if(e2){
      alert("Approved, but wallet credit was blocked by RLS. We’ll fix using RPC next.\n\nError: " + e2.message);
      await loadPendingSubs();
      return;
    }

    alert("Approved + credited (if policies allow).");
    await loadPendingSubs();
  }

  async function rejectSub(subId){
    const note = prompt("Rejection reason (required):") || "";
    if(!note.trim()){ alert("Please write a reason."); return; }

    const { data: sess } = await supabaseClient.auth.getSession();
    const reviewer = sess?.session?.user?.id || null;

    const { error } = await supabaseClient
      .from("task_submissions")
      .update({ status:"rejected", reviewed_at: new Date().toISOString(), reviewed_by: reviewer, review_note: note })
      .eq("id", subId);

    if(error){ alert("Error: " + error.message); return; }
    await loadPendingSubs();
  }

  window.approveSub = approveSub;
  window.rejectSub  = rejectSub;

  document.getElementById("createTask").addEventListener("click", createTask);
  document.getElementById("refreshTasks").addEventListener("click", loadTasks);
  document.getElementById("refreshSubs").addEventListener("click", loadPendingSubs);

  document.getElementById("signOut").addEventListener("click", async ()=>{
    await supabaseClient.auth.signOut();
    location.href = "auth.html";
  });

  (async ()=>{
    const ok = await requireAdmin();
    if(!ok) return;
    await loadTasks();
    await loadPendingSubs();
  })();
</script>

</body>
</html>
